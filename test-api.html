<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .movie { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Movie API Test</h1>
    <button onclick="testMoviesAPI()">Test Movies API</button>
    <div id="results"></div>

    <script>
        async function testMoviesAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing API...</p>';
            
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                
                if (movies && movies.length > 0) {
                    resultsDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ API Working! Found ${movies.length} movies:</h3>
                            ${movies.map(movie => `
                                <div class="movie">
                                    <h4>${movie.title}</h4>
                                    <p><strong>Genre:</strong> ${movie.genre}</p>
                                    <p><strong>Rating:</strong> ${movie.rating}</p>
                                    <p><strong>Release Date:</strong> ${movie.releaseDate}</p>
                                    <p><strong>End Date:</strong> ${movie.endDate}</p>
                                    <p><strong>Currently Showing:</strong> ${movie.isCurrentlyShowing ? 'Yes' : 'No'}</p>
                                    <p><strong>Coming Soon:</strong> ${movie.isComingSoon ? 'Yes' : 'No'}</p>
                                    <p><strong>Active:</strong> ${movie.isActive ? 'Yes' : 'No'}</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = '<div class="error">❌ No movies found in API response</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ API Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
