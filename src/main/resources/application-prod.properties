# Production Configuration for Railway Deployment
spring.application.name=MovieTicketBooking
server.port=${PORT:8080}

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Database Configuration - Railway PostgreSQL
# Railway provides DATABASE_URL in format: postgresql://user:pass@host:port/db
# We need to ensure it has the jdbc: prefix for PostgreSQL driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/movie_ticket_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Spring Data Web Support Configuration
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.sort.sort-parameter=sort

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=86400000

# CORS Configuration - Update with your Railway domain
cors.allowed.origins=${CORS_ORIGINS:https://your-app-name.railway.app}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Email Settings
app.mail.from=${MAIL_FROM:noreply@moviehub.com}
app.mail.from-name=MovieHub
app.base-url=${BASE_URL:https://your-app-name.railway.app}

# Cashfree Payment Gateway Configuration
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.environment=${CASHFREE_ENVIRONMENT:SANDBOX}

# Cashfree API Configuration
cashfree.api.version=2023-08-01
cashfree.return.url=${BASE_URL:https://your-app-name.railway.app}/payment/success
cashfree.notify.url=${BASE_URL:https://your-app-name.railway.app}/payment/webhook

# Logging Configuration for Production
logging.level.root=INFO
logging.level.com.example.MovieTicketBooking=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Security Configuration
server.error.include-stacktrace=never
server.error.include-message=never
