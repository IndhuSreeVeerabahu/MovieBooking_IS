<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Movie Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-4xl font-bold mb-4">Debug Information</h1>
        
        <div th:if="${error}" class="bg-red-900/50 border border-red-500 rounded-lg p-4 mb-4">
            <p class="text-red-300">Error: <span th:text="${error}"></span></p>
        </div>
        
        <div th:if="${status}" class="bg-green-900/50 border border-green-500 rounded-lg p-4 mb-4">
            <p class="text-green-300">Status: <span th:text="${status}"></span></p>
            <p class="text-green-300">User Count: <span th:text="${userCount}"></span></p>
        </div>
        
        <div class="space-x-4">
            <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors">
                Home
            </a>
            <a href="/test" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg transition-colors">
                Test
            </a>
        </div>
    </div>
</body>
</html>
