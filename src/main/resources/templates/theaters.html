<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theaters - MovieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bms-red': '#F84464',
                        'bms-dark': '#1A1A1A',
                        'bms-gray': '#2A2A2A',
                        'bms-light-gray': '#3A3A3A'
                    }
                }
            }
        }
    </script>
    <style>
        .movie-bg {
            background: linear-gradient(135deg, #1A1A1A 0%, #2A2A2A 50%, #1A1A1A 100%);
            position: relative;
        }
        
        .movie-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(248, 68, 100, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(248, 68, 100, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .glass-effect {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .theater-card {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.9) 0%, rgba(42, 42, 42, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .theater-card:hover {
            border-color: rgba(248, 68, 100, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(248, 68, 100, 0.2);
        }
    </style>
</head>
<body class="bg-bms-dark min-h-screen movie-bg">
    <!-- Navigation -->
    <nav class="relative glass-effect border-b border-gray-700" style="z-index: 100 !important;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <a href="/movies" class="text-2xl font-bold text-white hover:text-bms-red transition-colors">MovieHub</a>
                </div>
                
                <!-- Navigation Links -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/movies" class="text-white hover:text-bms-red transition-colors font-medium">Movies</a>
                    <a href="/theaters" class="text-bms-red hover:text-white transition-colors font-medium">Theaters</a>
                </div>
                
                <!-- User Menu -->
                <div class="flex items-center space-x-4" th:if="${user != null}">
                    <div class="text-right hidden sm:block">
                        <p class="text-white font-medium" th:text="${user.firstName + ' ' + user.lastName}">User Name</p>
                        <p class="text-gray-400 text-sm" th:text="${user.email}">user@example.com</p>
                    </div>
                    <div class="relative" style="z-index: 99999 !important;">
                        <button onclick="toggleUserMenu()" class="flex items-center text-gray-300 hover:text-white focus:outline-none">
                            <div class="w-8 h-8 bg-bms-red rounded-full flex items-center justify-center">
                                <span class="text-white font-semibold text-sm" th:text="${user.firstName != null ? user.firstName.substring(0,1) : 'U'}">U</span>
                            </div>
                        </button>
                        
                        <!-- Dropdown Menu -->
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-bms-gray rounded-lg shadow-lg border border-gray-700 py-1" style="z-index: 99999 !important;">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white">My Profile</a>
                            <a href="/bookings" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white">My Bookings</a>
                            <a href="/settings" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white">Settings</a>
                            <div th:if="${user.role == T(com.example.MovieTicketBooking.entity.User$Role).ADMIN}">
                                <hr class="my-1 border-gray-600">
                                <a href="/admin/dashboard" class="block px-4 py-2 text-sm text-bms-red hover:bg-bms-light-gray hover:text-white font-medium">
                                    Admin Dashboard
                                </a>
                            </div>
                            <hr class="my-1 border-gray-600">
                            <form th:action="@{/logout}" method="post" class="block">
                                <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white">
                                    Sign Out
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- Login/Register buttons when user is not logged in -->
                <div class="flex items-center space-x-4" th:if="${user == null}">
                    <a href="/login" class="text-white hover:text-bms-red transition-colors font-medium">Login</a>
                    <a href="/register" class="bg-bms-red hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium transition-colors">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="relative py-20" style="z-index: 1 !important;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-5xl font-bold text-white mb-4">Our Theaters</h1>
            <p class="text-xl text-gray-300 mb-8">Discover premium theaters with state-of-the-art facilities for the ultimate movie experience</p>
            
            <!-- Search Bar -->
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <input type="text" id="theaterSearch" placeholder="Search theaters by name or location..." 
                           class="w-full px-6 py-4 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red text-lg">
                    <button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-bms-red hover:text-white transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12" style="z-index: 1 !important;">
        <!-- Filter Section -->
        <div class="mb-8">
            <div class="flex flex-wrap items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-white mb-4">All Theaters</h2>
                <div class="flex flex-wrap gap-4">
                    <select id="cityFilter" class="px-4 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:border-bms-red">
                        <option value="">All Cities</option>
                    </select>
                    <select id="stateFilter" class="px-4 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:border-bms-red">
                        <option value="">All States</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Theaters Grid -->
        <div id="theatersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Theaters will be loaded here -->
            <div class="col-span-full text-center py-12 text-gray-400">
                <div class="flex items-center justify-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-bms-red"></div>
                    <span class="ml-2">Loading theaters...</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let theaters = [];
        let filteredTheaters = [];

        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            if (menu) {
                menu.classList.toggle('hidden');
            }
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('userMenu');
            const button = event.target.closest('button');
            const menuElement = event.target.closest('#userMenu');
            
            if (menu && !button && !menuElement) {
                menu.classList.add('hidden');
            }
        });

        // Load theaters from API
        async function loadTheaters() {
            try {
                const response = await fetch('/api/theaters');
                if (!response.ok) {
                    throw new Error('Failed to fetch theaters');
                }
                
                const theatersData = await response.json();
                theaters = theatersData;
                filteredTheaters = theaters;
                displayTheaters();
                populateFilters();
            } catch (error) {
                console.error('Error loading theaters:', error);
                
                // Fallback to mock data with Tamil Nadu locations
                const mockTheaters = [
                    {
                        id: 1,
                        name: 'PVR Cinemas Phoenix MarketCity',
                        address: '142, Velachery Main Road, Velachery',
                        city: 'Chennai',
                        state: 'Tamil Nadu',
                        pincode: '600042',
                        phoneNumber: '+91-44-12345678',
                        email: 'chennai@pvr.com',
                        totalScreens: 8,
                        amenities: 'IMAX, Dolby Atmos, Recliner Seats, Food Court',
                        isActive: true,
                        fullAddress: '142, Velachery Main Road, Velachery, Chennai, Tamil Nadu - 600042'
                    },
                    {
                        id: 2,
                        name: 'INOX Megaplex Express Avenue',
                        address: 'Express Avenue Mall, White\'s Road, Royapettah',
                        city: 'Chennai',
                        state: 'Tamil Nadu',
                        pincode: '600014',
                        phoneNumber: '+91-44-87654321',
                        email: 'chennai@inox.com',
                        totalScreens: 12,
                        amenities: '4DX, IMAX, Premium Lounges, Parking',
                        isActive: true,
                        fullAddress: 'Express Avenue Mall, White\'s Road, Royapettah, Chennai, Tamil Nadu - 600014'
                    },
                    {
                        id: 3,
                        name: 'Cinepolis Forum Mall',
                        address: 'Forum Vijaya Mall, 183, Arcot Road, Vadapalani',
                        city: 'Chennai',
                        state: 'Tamil Nadu',
                        pincode: '600026',
                        phoneNumber: '+91-44-98765432',
                        email: 'chennai@cinepolis.com',
                        totalScreens: 6,
                        amenities: 'Standard Screens, Concessions, Gaming Zone',
                        isActive: true,
                        fullAddress: 'Forum Vijaya Mall, 183, Arcot Road, Vadapalani, Chennai, Tamil Nadu - 600026'
                    },
                    {
                        id: 4,
                        name: 'Sathyam Cinemas',
                        address: '8, Thiruvika Road, Royapettah',
                        city: 'Chennai',
                        state: 'Tamil Nadu',
                        pincode: '600014',
                        phoneNumber: '+91-44-23456789',
                        email: 'chennai@sathyam.com',
                        totalScreens: 4,
                        amenities: 'Luxury Seating, Bar Service, Valet Parking',
                        isActive: true,
                        fullAddress: '8, Thiruvika Road, Royapettah, Chennai, Tamil Nadu - 600014'
                    }
                ];
                
                theaters = mockTheaters;
                filteredTheaters = theaters;
                displayTheaters();
                populateFilters();
            }
        }

        function displayTheaters() {
            const grid = document.getElementById('theatersGrid');
            
            if (filteredTheaters.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                        <p class="text-xl">No theaters found</p>
                        <p class="text-sm">Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredTheaters.map(theater => `
                <div class="theater-card rounded-lg p-6">
                    <div class="mb-4">
                        <h3 class="text-xl font-semibold text-white mb-2">${theater.name}</h3>
                        <p class="text-gray-400 text-sm mb-2">${theater.fullAddress}</p>
                        <div class="flex items-center space-x-4 text-xs text-gray-500">
                            <span>📞 ${theater.phoneNumber}</span>
                            <span>📧 ${theater.email}</span>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm text-gray-300">Screens</span>
                            <span class="text-white font-medium">${theater.totalScreens}</span>
                        </div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm text-gray-300">Status</span>
                            <span class="text-green-400 text-sm font-medium">${theater.isActive ? 'Open' : 'Closed'}</span>
                        </div>
                    </div>
                    
                    ${theater.amenities ? `
                        <div class="mb-4">
                            <h4 class="text-sm font-medium text-gray-300 mb-2">Amenities</h4>
                            <p class="text-xs text-gray-400">${theater.amenities}</p>
                        </div>
                    ` : ''}
                    
                    <div class="flex space-x-3">
                        <button onclick="viewTheaterDetails(${theater.id})" 
                                class="flex-1 bg-bms-red hover:bg-red-600 text-white py-2 px-4 rounded-lg transition-colors font-medium text-sm">
                            View Movies
                        </button>
                        <button onclick="viewShows(${theater.id})" 
                                class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded-lg transition-colors font-medium text-sm">
                            View Shows
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function populateFilters() {
            const cities = [...new Set(theaters.map(theater => theater.city))].sort();
            const states = [...new Set(theaters.map(theater => theater.state))].sort();
            
            const cityFilter = document.getElementById('cityFilter');
            const stateFilter = document.getElementById('stateFilter');
            
            cityFilter.innerHTML = '<option value="">All Cities</option>';
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                cityFilter.appendChild(option);
            });
            
            stateFilter.innerHTML = '<option value="">All States</option>';
            states.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateFilter.appendChild(option);
            });
        }

        function filterTheaters() {
            const searchTerm = document.getElementById('theaterSearch').value.toLowerCase();
            const cityFilter = document.getElementById('cityFilter').value;
            const stateFilter = document.getElementById('stateFilter').value;

            filteredTheaters = theaters.filter(theater => {
                const matchesSearch = theater.name.toLowerCase().includes(searchTerm) ||
                                    theater.address.toLowerCase().includes(searchTerm) ||
                                    theater.city.toLowerCase().includes(searchTerm);
                const matchesCity = !cityFilter || theater.city === cityFilter;
                const matchesState = !stateFilter || theater.state === stateFilter;

                return matchesSearch && matchesCity && matchesState;
            });

            displayTheaters();
        }

        function viewTheaterDetails(theaterId) {
            // Navigate to movies page filtered by this theater to show available shows
            window.location.href = `/movies?theater=${theaterId}`;
        }

        function viewShows(theaterId) {
            // Navigate to movies page with theater filter to show shows for this theater
            window.location.href = `/movies?theater=${theaterId}`;
        }

        // Event listeners
        document.getElementById('theaterSearch').addEventListener('input', filterTheaters);
        document.getElementById('cityFilter').addEventListener('change', filterTheaters);
        document.getElementById('stateFilter').addEventListener('change', filterTheaters);

        // Load theaters on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadTheaters();
        });

    </script>
</body>
</html>
