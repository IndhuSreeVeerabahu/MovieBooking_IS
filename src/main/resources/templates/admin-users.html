<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/admin-ui-fixes.css">
    <link rel="stylesheet" href="/css/validation.css">
    <script src="/js/notification-system.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bms-red': '#F84464',
                        'bms-dark': '#1A1A1A',
                        'bms-gray': '#2A2A2A',
                        'bms-light-gray': '#3A3A3A'
                    }
                }
            }
        }
    </script>
    <style>
        .movie-bg {
            background: linear-gradient(135deg, #1A1A1A 0%, #2A2A2A 50%, #1A1A1A 100%);
            position: relative;
        }
        
        .movie-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(248, 68, 100, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(248, 68, 100, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .glass-effect {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .user-card {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.9) 0%, rgba(42, 42, 42, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(248, 68, 100, 0.2);
            transition: all 0.3s ease;
        }
        
        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(248, 68, 100, 0.2);
        }
        
        /* All z-index and positioning handled by emergency fix CSS */
    </style>
</head>
<body class="bg-bms-dark min-h-screen movie-bg">
    <!-- Navigation -->
    <nav class="relative z-10 glass-effect border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <a href="/admin/dashboard" class="text-2xl font-bold text-white hover:text-bms-red transition-colors">MovieHub Admin</a>
                    <span class="ml-2 px-2 py-1 bg-bms-red text-white text-xs rounded-full">ADMIN</span>
                </div>
                
                <!-- User Menu -->
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <p class="text-white font-medium" th:text="${user.firstName + ' ' + user.lastName}">Admin User</p>
                        <p class="text-gray-400 text-sm" th:text="${user.email}">admin@moviehub.com</p>
                    </div>
                    <div class="relative">
                        <button id="userMenuButton" class="flex items-center text-gray-300 hover:text-white focus:outline-none focus:ring-2 focus:ring-bms-red rounded-full p-1">
                            <div class="w-8 h-8 bg-bms-red rounded-full flex items-center justify-center">
                                <span class="text-white font-semibold text-sm" th:text="${user.firstName.substring(0,1)}">A</span>
                            </div>
                        </button>
                        
                        <!-- Dropdown Menu -->
                        <div id="userMenu" class="hidden dropdown-menu right-0 mt-1 w-48 rounded-lg py-1" style="position: absolute; z-index: 99999; background: #2A2A2A; border: 1px solid #374151; border-radius: 0.5rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);">
                            <a href="/admin/dashboard" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white transition-colors">Admin Dashboard</a>
                            <a href="/admin/movies" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white transition-colors">Movie Management</a>
                            <a href="/admin/users" class="block px-4 py-2 text-sm text-bms-red hover:bg-bms-light-gray hover:text-white transition-colors">User Management</a>
                            <a href="/admin/theaters" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white transition-colors">Theater Management</a>
                            <a href="/admin/shows" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white transition-colors">Show Management</a>
                            <a href="/dashboard" class="block px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white transition-colors">User Dashboard</a>
                            <hr class="my-1 border-gray-600">
                            <form th:action="@{/logout}" method="post" class="block">
                                <button type="submit" class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-bms-light-gray hover:text-white transition-colors">
                                    Sign Out
                                </button>
                            </form>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-white mb-2">User Management</h2>
                    <p class="text-gray-400">Manage user accounts and permissions</p>
                </div>
                <div class="flex space-x-4 header-buttons">
                    <button onclick="refreshUsers()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors">
                        Refresh
                    </button>
                    <div class="relative">
                        <button onclick="showExportMenu()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center">
                            Export Users
                            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="exportMenu" class="hidden absolute right-0 mt-2 w-48 bg-bms-light-gray border border-gray-600 rounded-lg shadow-lg z-10">
                            <button onclick="exportUsers('csv')" class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 rounded-t-lg">
                                Export as CSV
                            </button>
                            <button onclick="exportUsers('excel')" class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 rounded-b-lg">
                                Export as Excel
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="user-card rounded-lg p-6 mb-8 filter-section">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Search Users</label>
                    <input type="text" id="searchInput" placeholder="Search by name or email..." 
                           class="w-full px-4 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Filter by Role</label>
                    <select id="roleFilter" class="w-full px-4 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:border-bms-red">
                        <option value="">All Roles</option>
                        <option value="USER">Users</option>
                        <option value="ADMIN">Admins</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Filter by Status</label>
                    <select id="statusFilter" class="w-full px-4 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:border-bms-red">
                        <option value="">All Status</option>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end mt-4">
                <button onclick="clearFilters()" class="px-4 py-2 text-gray-300 hover:text-white transition-colors">
                    Clear Filters
                </button>
            </div>
        </div>

        <!-- Users List -->
        <div class="user-card rounded-lg p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold text-white">All Users</h3>
                <span class="text-gray-400" id="userCount">Loading...</span>
            </div>
            
            <!-- Users Table -->
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-gray-600">
                            <th class="text-left py-3 px-4 text-gray-300 font-medium">User</th>
                            <th class="text-left py-3 px-4 text-gray-300 font-medium">Email</th>
                            <th class="text-left py-3 px-4 text-gray-300 font-medium">Role</th>
                            <th class="text-left py-3 px-4 text-gray-300 font-medium">Status</th>
                            <th class="text-left py-3 px-4 text-gray-300 font-medium">Joined</th>
                            <th class="text-left py-3 px-4 text-gray-300 font-medium">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Users will be loaded here -->
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-400">
                                <div class="flex items-center justify-center">
                                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-bms-red"></div>
                                    <span class="ml-2">Loading users...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            const button = document.getElementById('userMenuButton');
            
            if (menu) {
                menu.classList.toggle('hidden');
                
                // Add visual feedback
                if (menu.classList.contains('hidden')) {
                    button.classList.remove('ring-2', 'ring-bms-red');
                } else {
                    button.classList.add('ring-2', 'ring-bms-red');
                }
            }
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('userMenu');
            const button = document.getElementById('userMenuButton');
            const menuElement = event.target.closest('#userMenu');
            const buttonElement = event.target.closest('#userMenuButton');
            
            if (menu && !buttonElement && !menuElement) {
                menu.classList.add('hidden');
                button.classList.remove('ring-2', 'ring-bms-red');
            }
        });

        // Add event listener to the button and load users
        document.addEventListener('DOMContentLoaded', function() {
            const button = document.getElementById('userMenuButton');
            
            if (button) {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleUserMenu();
                });
            }
            
            // Load users when page loads
            loadUsers();
        });

        // Load users from API
        async function loadUsers() {
            console.log('Loading users...');
            try {
                const response = await fetch('/api/admin/users', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include' // Include cookies for authentication
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`API Error ${response.status}: ${errorText}`);
                }
                
                const usersData = await response.json();
                console.log('Users data received:', usersData);
                displayUsers(usersData);
            } catch (error) {
                console.error('Error loading users:', error);
                
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-8 text-red-400">
                            <div class="space-y-2">
                                <p>Failed to load users</p>
                                <p class="text-sm text-gray-500">Error: ${error.message}</p>
                                <button onclick="loadUsers()" class="mt-2 px-4 py-2 bg-bms-red text-white rounded hover:bg-red-600">
                                    Retry
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }

        function displayUsers(users) {
            console.log('Displaying users:', users);
            const tbody = document.getElementById('usersTableBody');
            const userCount = document.getElementById('userCount');
            
            console.log('Table body element:', tbody);
            console.log('User count element:', userCount);
            
            userCount.textContent = `${users.length} users found`;
            
            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-8 text-gray-400">
                            No users found
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr class="border-b border-gray-700 hover:bg-bms-light-gray/20">
                    <td class="py-4 px-4">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-bms-red rounded-full flex items-center justify-center mr-3">
                                <span class="text-white font-semibold text-sm">${user.firstName.charAt(0)}</span>
                            </div>
                            <div>
                                <p class="text-white font-medium">${user.firstName} ${user.lastName}</p>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-4 text-gray-300">${user.email}</td>
                    <td class="py-4 px-4">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${user.role === 'ADMIN' ? 'bg-bms-red text-white' : 'bg-gray-600 text-gray-300'}">
                            ${user.role}
                        </span>
                    </td>
                    <td class="py-4 px-4">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${user.isEnabled ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}">
                            ${user.isEnabled ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="py-4 px-4 text-gray-300">${new Date(user.createdAt).toLocaleDateString()}</td>
                    <td class="py-4 px-4">
                        <div class="flex space-x-2">
                            <button onclick="editUser(${user.id})" class="text-blue-400 hover:text-blue-300 text-sm">Edit</button>
                            <button onclick="toggleUserStatus(${user.id})" class="text-yellow-400 hover:text-yellow-300 text-sm">
                                ${user.isEnabled ? 'Disable' : 'Enable'}
                            </button>
                            ${user.role !== 'ADMIN' ? `<button onclick="deleteUser(${user.id})" class="text-red-400 hover:text-red-300 text-sm">Delete</button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('roleFilter').value = '';
            document.getElementById('statusFilter').value = '';
            
            // Reset to show all users
            displayUsers(users);
        }

        function refreshUsers() {
            // Clear all filters first
            clearFilters();
            
            // Reload data
            loadUsers();
        }

        function showExportMenu() {
            const menu = document.getElementById('exportMenu');
            menu.classList.toggle('hidden');
        }

        function exportUsers(format) {
            // Hide the menu
            document.getElementById('exportMenu').classList.add('hidden');
            
            // Show loading state
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Exporting...';
            button.disabled = true;
            
            // Make the export request
            const url = `/api/admin/export/users/${format}`;
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Export failed');
                }
                return response.blob();
            })
            .then(blob => {
                // Create download link
                const downloadUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = `users_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(downloadUrl);
                
                // Show success message
                showNotification('Users exported successfully!', 'success');
            })
            .catch(error => {
                console.error('Export error:', error);
                showNotification('Failed to export users. Please try again.', 'error');
            })
            .finally(() => {
                // Reset button state
                button.textContent = originalText;
                button.disabled = false;
            });
        }

        // Close export menu when clicking outside
        document.addEventListener('click', function(event) {
            const exportMenu = document.getElementById('exportMenu');
            const exportButton = event.target.closest('[onclick="showExportMenu()"]');
            
            if (!exportButton && !exportMenu.contains(event.target)) {
                exportMenu.classList.add('hidden');
            }
        });

        // Fallback notification function
        function showNotification(message, type) {
            if (window.notificationSystem) {
                if (type === 'success') {
                    window.notificationSystem.success(message);
                } else if (type === 'error') {
                    window.notificationSystem.error(message);
                } else {
                    window.notificationSystem.info(message);
                }
            } else {
                alert(message);
            }
        }

        function editUser(userId) {
            
            const user = users.find(u => u.id == userId);
            if (!user) {
                console.error('User not found with ID:', userId);
                showNotification('The requested user could not be found. Please refresh the page and try again.', 'error');
                return;
            }
            
            console.log('Found user:', user);

            // Populate the edit form with user data
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editUserFirstName').value = user.firstName || '';
            document.getElementById('editUserLastName').value = user.lastName || '';
            document.getElementById('editUserEmail').value = user.email || '';
            document.getElementById('editUserPhone').value = user.phoneNumber || '';
            document.getElementById('editUserRole').value = user.role || 'USER';
            document.getElementById('editUserStatus').value = user.isActive ? 'true' : 'false';

            // Show the modal
            showEditUserModal();
        }

        function showEditUserModal() {
            console.log('Showing edit user modal');
            const modal = document.getElementById('editUserModal');
            if (modal) {
                console.log('Modal found, removing hidden class');
                modal.classList.remove('hidden');
                document.body.classList.add('modal-open');
            } else {
                console.error('Edit user modal not found!');
            }
        }

        function hideEditUserModal() {
            const modal = document.getElementById('editUserModal');
            if (modal) {
                modal.classList.add('hidden');
                document.body.classList.remove('modal-open');
                
                // Reset form
                const form = document.getElementById('editUserForm');
                if (form) {
                    form.reset();
                }
            }
        }

        async function toggleUserStatus(userId) {
            if (confirm('Are you sure you want to toggle this user\'s status?')) {
                try {
                    const response = await fetch(`/api/admin/users/${userId}/toggle-status`, {
                        method: 'PUT'
                    });

                    if (response.ok) {
                        window.notificationSystem.success(
                            'The user status has been updated successfully.',
                            {
                                title: 'Status Updated',
                                duration: 4000
                            }
                        );
                        loadUsers(); // Refresh the list
                    } else {
                        window.notificationSystem.error(
                            'Unable to update the user status. Please try again.',
                            {
                                title: 'Status Update Failed',
                                duration: 6000
                            }
                        );
                    }
                } catch (error) {
                    console.error('Error toggling user status:', error);
                    window.notificationSystem.error(
                        'A network error occurred while updating the user status. Please check your connection and try again.',
                        {
                            title: 'Connection Error',
                            duration: 0
                        }
                    );
                }
            }
        }

        async function deleteUser(userId) {
            const user = users.find(u => u.id == userId);
            const userName = user ? `${user.firstName} ${user.lastName}` || user.email : 'this user';
            
            if (confirm(`Are you sure you want to remove "${userName}" from the system?\n\nThis action will permanently delete the user account and all associated data. This action cannot be undone.`)) {
                try {
                    const response = await fetch(`/api/admin/users/${userId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        window.notificationSystem.success(
                            'The user account has been removed from the system successfully.',
                            {
                                title: 'User Deleted',
                                duration: 4000
                            }
                        );
                        loadUsers(); // Refresh the list
                    } else {
                        window.notificationSystem.error(
                            'Unable to delete the user account. Please try again.',
                            {
                                title: 'Deletion Failed',
                                duration: 6000
                            }
                        );
                    }
                } catch (error) {
                    console.error('Error deleting user:', error);
                    window.notificationSystem.error(
                        'A network error occurred while deleting the user. Please check your connection and try again.',
                        {
                            title: 'Connection Error',
                            duration: 0
                        }
                    );
                }
            }
        }

        // Edit user form submission
        document.getElementById('editUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('editUserId').value;
            const userData = {
                fullName: `${document.getElementById('editUserFirstName').value} ${document.getElementById('editUserLastName').value}`.trim(),
                email: document.getElementById('editUserEmail').value,
                phoneNumber: document.getElementById('editUserPhone').value,
                role: document.getElementById('editUserRole').value,
                isActive: document.getElementById('editUserStatus').value === 'true'
            };

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    hideEditUserModal();
                    loadUsers();
                    window.notificationSystem.success(
                        'The user information has been updated successfully.',
                        {
                            title: 'User Updated',
                            duration: 4000
                        }
                    );
                } else {
                    const errorData = await response.json();
                    window.notificationSystem.error(
                        'Unable to update the user. ' + (errorData.message || 'Please check your input and try again.'),
                        {
                            title: 'Update Failed',
                            duration: 6000
                        }
                    );
                }
            } catch (error) {
                console.error('Error updating user:', error);
                window.notificationSystem.error(
                    'A network error occurred while updating the user. Please check your connection and try again.',
                    {
                        title: 'Connection Error',
                        duration: 0
                    }
                );
            }
        });

        // Load users on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM Content Loaded - calling loadUsers()');
            loadUsers();
        });
    </script>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-bms-gray rounded-lg p-6 w-full max-w-md mx-4 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-white">Edit User</h3>
                <button onclick="hideEditUserModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">First Name</label>
                        <input type="text" id="editUserFirstName" required class="w-full px-3 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bms-red">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Last Name</label>
                        <input type="text" id="editUserLastName" required class="w-full px-3 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bms-red">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                        <input type="email" id="editUserEmail" required class="w-full px-3 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bms-red">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Phone Number</label>
                        <input type="tel" id="editUserPhone" class="w-full px-3 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bms-red">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Role</label>
                        <select id="editUserRole" required class="w-full px-3 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bms-red">
                            <option value="USER">User</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Status</label>
                        <select id="editUserStatus" required class="w-full px-3 py-2 bg-bms-light-gray border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bms-red">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="hideEditUserModal()" class="px-4 py-2 text-gray-300 hover:text-white transition-colors">Cancel</button>
                    <button type="submit" class="px-6 py-2 bg-bms-red hover:bg-red-600 text-white rounded-lg transition-colors">Update User</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
