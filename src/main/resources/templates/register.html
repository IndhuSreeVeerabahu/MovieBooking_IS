<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Movie Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/validation.css">
    <link rel="stylesheet" href="/css/modal-system.css">
    <script src="/js/form-validation.js"></script>
    <script src="/js/modal-system.js"></script>
    <script src="/js/notification-system.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'bms-red': '#F84464',
                        'bms-dark': '#1A1A1A',
                        'bms-gray': '#2A2A2A',
                        'bms-light-gray': '#3A3A3A'
                    }
                }
            }
        }
    </script>
    <style>
        .bg-gradient-bms {
            background: linear-gradient(135deg, #1A1A1A 0%, #2A2A2A 50%, #1A1A1A 100%);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(248, 68, 100, 0.1);
        }
        
        .movie-bg {
            background: linear-gradient(135deg, #1A1A1A 0%, #2A2A2A 50%, #1A1A1A 100%);
            position: relative;
        }
        
        .movie-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(248, 68, 100, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(248, 68, 100, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-bms-dark min-h-screen flex items-center justify-center py-8 movie-bg">
    <!-- Floating Elements -->
    <div class="fixed top-10 left-10 w-20 h-20 bg-bms-red/10 rounded-full blur-xl"></div>
    <div class="fixed bottom-10 right-10 w-32 h-32 bg-bms-red/5 rounded-full blur-2xl"></div>
    <div class="fixed top-1/2 left-1/4 w-16 h-16 bg-bms-red/10 rounded-full blur-lg"></div>
    
    <div class="relative z-10 w-full max-w-md mx-4">
        <!-- Logo/Brand -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-white mb-2">MovieHub</h1>
            <p class="text-gray-400">Your Gateway to Entertainment</p>
        </div>

        <!-- Register Card -->
        <div class="bg-bms-gray rounded-2xl shadow-2xl p-8 border border-gray-700">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-white mb-2">Create Account</h2>
                <p class="text-gray-400">Join us and start your movie journey</p>
            </div>

            <!-- Alert Messages -->
            <div th:if="${error}" class="mb-4 p-4 bg-red-900/50 border border-red-500 rounded-lg">
                <p class="text-red-300 text-sm" th:text="${error}"></p>
            </div>
            <div th:if="${success}" class="mb-4 p-4 bg-green-900/50 border border-green-500 rounded-lg">
                <p class="text-green-300 text-sm" th:text="${success}"></p>
            </div>

            <!-- Register Form -->
            <form id="registerForm" th:action="@{/register}" method="post" class="space-y-4" novalidate data-validation="true">
                <!-- Name Fields -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-300 mb-2">
                            First Name <span class="text-red-400">*</span>
                        </label>
                        <input type="text" 
                               id="firstName" 
                               name="firstName" 
                               required
                               minlength="2"
                               maxlength="50"
                               class="w-full px-4 py-3 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red input-focus transition-all duration-200"
                               placeholder="First name">
                        <div id="firstNameError" class="hidden mt-1 text-sm text-red-400"></div>
                    </div>
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-300 mb-2">
                            Last Name <span class="text-red-400">*</span>
                        </label>
                        <input type="text" 
                               id="lastName" 
                               name="lastName" 
                               required
                               minlength="2"
                               maxlength="50"
                               class="w-full px-4 py-3 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red input-focus transition-all duration-200"
                               placeholder="Last name">
                        <div id="lastNameError" class="hidden mt-1 text-sm text-red-400"></div>
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                        Email Address <span class="text-red-400">*</span>
                    </label>
                    <div class="relative">
                        <input type="email" 
                               id="email" 
                               name="email" 
                               required
                               class="w-full px-4 py-3 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red input-focus transition-all duration-200"
                               placeholder="Enter your email">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                            </svg>
                        </div>
                    </div>
                    <div id="emailError" class="hidden mt-1 text-sm text-red-400"></div>
                </div>

                <!-- Phone Field -->
                <div>
                    <label for="phoneNumber" class="block text-sm font-medium text-gray-300 mb-2">
                        Phone Number (Optional)
                    </label>
                    <div class="relative">
                        <input type="tel" 
                               id="phoneNumber" 
                               name="phoneNumber"
                               pattern="[0-9]{10}"
                               class="w-full px-4 py-3 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red input-focus transition-all duration-200"
                               placeholder="Enter your phone number">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                        </div>
                    </div>
                    <div id="phoneError" class="hidden mt-1 text-sm text-red-400"></div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        Password <span class="text-red-400">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" 
                               id="password" 
                               name="password" 
                               required
                               minlength="6"
                               class="w-full px-4 py-3 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red input-focus transition-all duration-200"
                               placeholder="Create a password">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                    </div>
                    <div id="passwordError" class="hidden mt-1 text-sm text-red-400"></div>
                    <p class="mt-1 text-xs text-gray-400">Password must be at least 6 characters long</p>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-2">
                        Confirm Password <span class="text-red-400">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" 
                               id="confirmPassword" 
                               name="confirmPassword" 
                               required
                               class="w-full px-4 py-3 bg-bms-light-gray border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-bms-red input-focus transition-all duration-200"
                               placeholder="Confirm your password">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                    </div>
                    <div id="confirmPasswordError" class="hidden mt-1 text-sm text-red-400"></div>
                </div>

                <!-- Terms and Conditions -->
                <div class="flex items-start">
                    <input type="checkbox" 
                           id="terms" 
                           name="terms" 
                           required
                           class="mt-1 h-4 w-4 text-bms-red focus:ring-bms-red border-gray-600 rounded bg-bms-light-gray">
                    <label for="terms" class="ml-2 block text-sm text-gray-300">
                        I agree to the 
                        <a href="#" class="text-bms-red hover:text-red-400">Terms of Service</a> 
                        and 
                        <a href="#" class="text-bms-red hover:text-red-400">Privacy Policy</a>
                        <span class="text-red-400">*</span>
                    </label>
                </div>
                <div id="termsError" class="hidden mt-1 text-sm text-red-400"></div>

                <!-- Register Button -->
                <button type="submit" 
                        class="w-full bg-bms-red hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-bms-red focus:ring-opacity-50">
                    Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="mt-6 mb-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-600"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-bms-gray text-gray-400">Already have an account?</span>
                    </div>
                </div>
            </div>

            <!-- Sign In Link -->
            <div class="text-center">
                <a th:href="@{/login}" 
                   class="inline-flex items-center justify-center w-full px-4 py-3 border border-gray-600 rounded-lg text-white font-medium hover:bg-bms-light-gray transition-all duration-200">
                    Sign In to Your Account
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-gray-500 text-sm">
                By creating an account, you agree to our 
                <a href="#" class="text-bms-red hover:text-red-400">Terms of Service</a> 
                and 
                <a href="#" class="text-bms-red hover:text-red-400">Privacy Policy</a>
            </p>
        </div>
    </div>

    <!-- Floating Elements for Visual Appeal -->
    <div class="fixed top-10 left-10 w-20 h-20 bg-bms-red/10 rounded-full blur-xl"></div>
    <div class="fixed bottom-10 right-10 w-32 h-32 bg-bms-red/5 rounded-full blur-2xl"></div>
    <div class="fixed top-1/2 left-1/4 w-16 h-16 bg-bms-red/10 rounded-full blur-lg"></div>

    <script>
        // Initialize form validation when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // The form validation is automatically initialized by the form-validation.js script
            // due to the data-validation="true" attribute on the form
            console.log('Registration form validation initialized');
            
            // Convert flash messages to notifications
            const errorMessage = /*[[${error}]]*/ null;
            const successMessage = /*[[${success}]]*/ null;
            
            if (errorMessage && window.notificationSystem) {
                window.notificationSystem.error(errorMessage, {
                    title: 'Registration Failed',
                    duration: 6000
                });
            }
            
            if (successMessage && window.notificationSystem) {
                window.notificationSystem.success(successMessage, {
                    title: 'Registration Successful',
                    duration: 4000
                });
            }
        });
    </script>
</body>
</html>
