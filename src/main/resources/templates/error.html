<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Movie Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-4xl font-bold text-red-500 mb-4">Oops! Something went wrong</h1>
        <p class="text-gray-300 mb-4">We encountered an error while processing your request.</p>
        <div class="bg-gray-800 p-4 rounded-lg mb-4">
            <p class="text-sm text-gray-400">Error: <span th:text="${error}">Unknown error</span></p>
            <p class="text-sm text-gray-400">Status: <span th:text="${status}">Unknown status</span></p>
        </div>
        <a href="/login" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors">
            Go to Login
        </a>
    </div>
</body>
</html>
