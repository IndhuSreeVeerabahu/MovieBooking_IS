<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - MovieHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center">💳 Complete Payment</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-gray-800 p-6 rounded-lg">
                <h2 class="text-xl font-bold mb-4">Booking Details</h2>
                <div class="space-y-3">
                    <p><strong>Movie:</strong> <span th:text="${booking.show.movie.title}">Movie Title</span></p>
                    <p><strong>Theater:</strong> <span th:text="${booking.show.theater.name}">Theater Name</span></p>
                    <p><strong>Show Time:</strong> <span th:text="${#temporals.format(booking.show.showTime, 'MMM dd, yyyy - HH:mm')}">Show Time</span></p>
                    <p><strong>Booking Reference:</strong> <span th:text="${booking.bookingReference}">BK123456</span></p>
                    <p><strong>Seats:</strong> <span th:text="${#strings.listJoin(booking.seats, ', ')}">A1, A2</span></p>
                    <p><strong>Total Amount:</strong> <span class="text-green-400 text-xl font-bold" th:text="'₹' + ${booking.totalAmount}">₹500</span></p>
                </div>
            </div>
            
            <!-- Payment -->
            <div class="bg-gray-800 p-6 rounded-lg">
                <h2 class="text-xl font-bold mb-4">Payment</h2>
                
                <div class="space-y-4 mb-6">
                    <div class="p-4 border border-gray-600 rounded-lg cursor-pointer hover:border-red-500 transition-colors" onclick="selectPaymentMethod('upi')">
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center mr-3">
                                <span class="text-white text-sm font-bold">U</span>
                            </div>
                            <span class="text-white font-medium">UPI</span>
                        </div>
                    </div>
                    
                    <div class="p-4 border border-gray-600 rounded-lg cursor-pointer hover:border-red-500 transition-colors" onclick="selectPaymentMethod('card')">
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center mr-3">
                                <span class="text-white text-sm font-bold">C</span>
                            </div>
                            <span class="text-white font-medium">Credit/Debit Card</span>
                        </div>
                    </div>
                    
                    <div class="p-4 border border-gray-600 rounded-lg cursor-pointer hover:border-red-500 transition-colors" onclick="selectPaymentMethod('netbanking')">
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center mr-3">
                                <span class="text-white text-sm font-bold">N</span>
                            </div>
                            <span class="text-white font-medium">Net Banking</span>
                        </div>
                    </div>
                </div>
                
                <button id="payButton" onclick="payNow()" 
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition-colors disabled:opacity-50">
                    <span id="payButtonText">Pay ₹<span th:text="${booking.totalAmount}">500</span></span>
                    <div id="loadingSpinner" class="hidden">
                        <div class="flex items-center justify-center">
                            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
                            Processing...
                        </div>
                    </div>
                </button>
                
                <div id="errorMessage" class="hidden mt-4 p-4 bg-red-600 text-white rounded-lg"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedPaymentMethod = null;

        function selectPaymentMethod(method) {
            selectedPaymentMethod = method;
            document.querySelectorAll('.border-red-500').forEach(el => el.classList.remove('border-red-500', 'bg-red-500', 'bg-opacity-10'));
            event.target.closest('.border-gray-600').classList.add('border-red-500', 'bg-red-500', 'bg-opacity-10');
        }

        async function payNow() {
            if (!selectedPaymentMethod) {
                showError('Please select a payment method');
                return;
            }

            const payButton = document.getElementById('payButton');
            const payButtonText = document.getElementById('payButtonText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            // Show loading
            payButton.disabled = true;
            payButtonText.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');
            hideError();

            try {
                console.log('Starting payment...');
                console.log('Payment Session ID:', "[[${paymentSessionId}]]");
                console.log('Cashfree App ID:', "[[${cashfreeAppId}]]");
                console.log('Environment:', "[[${environment}]]");

                // Check if Cashfree SDK is loaded
                if (typeof Cashfree === 'undefined') {
                    throw new Error('Cashfree SDK not loaded');
                }

                // Initialize Cashfree
                const cashfree = Cashfree({
                    mode: "[[${environment}]]"
                });

                console.log('Cashfree initialized');

                // Create checkout
                const result = await cashfree.checkout({
                    paymentSessionId: "[[${paymentSessionId}]]",
                    returnUrl: "http://localhost:8080/payment/success"
                });

                console.log('Cashfree result:', result);

                if (result.error) {
                    throw new Error(result.error.message || 'Payment failed');
                }

                if (result.redirectUrl) {
                    console.log('Redirecting to:', result.redirectUrl);
                    window.location.href = result.redirectUrl;
                } else {
                    throw new Error('No redirect URL received');
                }

            } catch (error) {
                console.error('Payment error:', error);
                showError('Payment failed: ' + error.message);
                
                // Reset button
                payButton.disabled = false;
                payButtonText.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
        });
    </script>
</body>
</html>
